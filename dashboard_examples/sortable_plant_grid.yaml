# Cet exemple montre comment utiliser un 'input_select' pour trier dynamiquement vos plantes.
#
# Pré-requis : Créer un helper 'input_select' dans Home Assistant (via Paramètres -> Appareils & Services -> Entrées)
# Nom : Mode de tri plantes
# ID : input_select.plant_sort_order
# Options :
#   - Nom
#   - Pièce
#   - Arrosage

type: vertical-stack
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: menu
      - type: template
        content: "Tri : {{ states('input_select.plant_sort_order') }}"
        icon: mdi:sort
        tap_action:
          action: call-service
          service: input_select.select_next
          target:
            entity_id: input_select.plant_sort_order

  - type: custom:auto-entities
    card:
      type: grid
      columns: 2
      square: false
    filter:
      include:
        - domain: plant
          options:
            type: custom:flower-card
            sort_entity: input_select.plant_sort_order
    sort:
      template: >
        {% set sort_order = states('input_select.plant_sort_order') | lower %}
        {% if sort_order == 'pièce' %}
          {{ {'method': 'attribute', 'attribute': 'area'} }}
        {% elif sort_order == 'arrosage' %}
          {{ {'method': 'attribute', 'attribute': 'next_watering', 'numeric': true} }}
        {% else %}
          {{ {'method': 'friendly_name'} }}
        {% endif %}

