# Dashboard complet : Page dédiée aux plantes avec tri dynamique
# Copiez ce code dans l'Éditeur de configuration brute de votre tableau de bord.

title: Mes Plantes
views:
- title: Plantes
  path: plantes
  icon: mdi:flower
  cards:
  - type: vertical-stack
    cards:
    # 1. Barre de contrôle Mushroom pour le tri
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
      - type: template
        content: "Tri : {{ states('input_select.plant_sort_order') | capitalize | default('Nom') }}"
        icon: mdi:sort
        tap_action:
          action: call-service
          service: input_select.select_next
          target:
            entity_id: input_select.plant_sort_order

      - type: template
        content: "Ajouter"
        icon: mdi:plus-circle
        icon_color: green
        tap_action:
          action: navigate
          navigation_path: "/config/integrations/dashboard/add?domain=plant"

    # 2. Grille de plantes auto-alimentée
    - type: custom:auto-entities
      show_empty: false
      card:
        type: grid
        columns: 1
        square: false
      card_param: cards
      filter:
        template: >
          {% set sort_order = states('input_select.plant_sort_order') | lower %}
          {% set entities = states.plant | map(attribute='entity_id') | list %}
          
          {# On crée une liste d'objets avec les infos de tri #}
          {% set plants = [] %}
          {% for entity in entities %}
            {% set state = states[entity] %}
            {% set next_watering = state.attributes.next_watering | default('0 j') %}
            {# On extrait juste le nombre pour le tri de l'arrosage #}
            {% set days = next_watering.split(' ')[0] | int %}
            
            {% set plant_obj = {
              'entity': entity,
              'name': state.attributes.friendly_name,
              'area': state.attributes.area | default(''),
              'watering': days
            } %}
            {% set plants = plants + [plant_obj] %}
          {% endfor %}

          {# Tri de la liste #}
          {% if 'arrosage' in sort_order %}
            {% set sorted_plants = plants | sort(attribute='watering') %}
          {% elif 'pièce' in sort_order or 'piece' in sort_order %}
            {% set sorted_plants = plants | sort(attribute='area') %}
          {% else %}
            {% set sorted_plants = plants | sort(attribute='name') %}
          {% endif %}

          {# Sortie au format HL (auto-entities attend une liste de cards config) #}
          {% for plant in sorted_plants %}
            {{ {
              'type': 'custom:flower-card',
              'entity': plant.entity,
              'sort_entity': 'input_select.plant_sort_order'
            } | tojson }},
          {% endfor %}
      # On n'a plus besoin du bloc sort: classique car le template gère tout
