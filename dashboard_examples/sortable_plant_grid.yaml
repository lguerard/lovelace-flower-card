# Dashboard complet : Page dédiée aux plantes avec tri dynamique
# Copiez ce code dans l'Éditeur de configuration brute de votre tableau de bord.

title: Mes Plantes
views:
- title: Plantes
  path: plantes
  icon: mdi:flower
  cards:
  - type: vertical-stack
    cards:
    # 1. Barre de contrôle Mushroom pour le tri
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
      - type: template
        content: "Tri : {{ states('input_select.plant_sort_order') | capitalize | default('Nom') }}"
        icon: mdi:sort
        tap_action:
          action: call-service
          service: input_select.select_next
          target:
            entity_id: input_select.plant_sort_order

      - type: template
        content: "Ajouter"
        icon: mdi:plus-circle
        icon_color: green
        tap_action:
          action: navigate
          navigation_path: "/config/integrations/dashboard/add?domain=plant"

    # 2. Grille de plantes auto-alimentée
    - type: custom:auto-entities
      show_empty: false
      card:
        type: grid
        columns: 1
        square: false
      card_param: cards
      filter:
        include:
        - domain: plant
          options:
            type: custom:flower-card
            sort_entity: input_select.plant_sort_order
      sort:
        template: >
          {%- set o = states('input_select.plant_sort_order') | lower -%} {%- if 'arrosage' in o -%}
            method: attribute
            attribute: next_watering
            numeric: true
          {%- elif 'pièce' in o or 'piece' in o -%}
            method: attribute
            attribute: area
          {%- else -%}
            method: friendly_name
          {%- endif -%}
